<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{background:#0b1020;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111827;padding:40px;border-radius:20px;width:320px}
input{width:100%;padding:12px;margin-top:15px;border:none;border-radius:10px}
button{width:100%;padding:12px;margin-top:20px;border:none;border-radius:10px;background:#2563eb;color:white;cursor:pointer}
a{color:#60a5fa}
</style>
</head>
<body>

<div class="box">
    <h1>Login 🔐</h1>

    <form action="/login" method="POST">
        <input type="email" name="email" placeholder="Email">
        <input type="password" name="senha" placeholder="Senha">
        <button type="submit">Entrar</button>
    </form>

    <p>
        Não tem conta?
        <a href="/cadastro">Criar conta</a>
    </p>
</div>

</body>
</html>
